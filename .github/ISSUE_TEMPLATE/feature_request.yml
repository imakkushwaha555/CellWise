name: Feature request
description: Suggest a focused improvement to Cellwise.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: What user problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the desired result without prescribing a particular implementation.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and trade-offs
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Data and privacy
      options:
        - label: This request does not require sending document contents to a remote service.
          required: true
