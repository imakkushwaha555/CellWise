name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.20.0
          cache: npm

      - name: Pin npm version
        run: |
          npm install --global npm@11.19.0
          test "$(npm --version)" = "11.19.0"

      - name: Install locked dependencies
        run: npm ci

      - name: Test, type-check, validate, and audit
        run: |
          npm run test
          npm run typecheck
          npm run validate
          npm audit --audit-level=high

      - name: Build Pages site and hosted add-in
        env:
          CELLWISE_BASE_URL: https://cellwise-ci.github.io/cellwise
          CELLWISE_REPOSITORY_URL: https://github.com/cellwise-ci/cellwise
        run: npm run pages:build

      - name: Generate SBOM and enforce dependency licenses
        run: |
          npm sbom --sbom-format cyclonedx --sbom-type application > "$RUNNER_TEMP/SBOM.cdx.json"
          node scripts/check-licenses.mjs "$RUNNER_TEMP/SBOM.cdx.json" "$RUNNER_TEMP/DEPENDENCY-LICENSES.txt"
