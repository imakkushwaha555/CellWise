<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title description">
  <title id="title">Cellwise — A1 formulas for Word tables</title>
  <desc id="description">Original Cellwise grid mark beside the text A1 formulas for Word tables, no helper rows or columns.</desc>
  <rect width="1280" height="640" fill="#2f2343"/>
  <circle cx="1050" cy="122" r="220" fill="#47365f" opacity=".58"/>
  <circle cx="1170" cy="540" r="280" fill="#47365f" opacity=".34"/>
  <g transform="translate(104 144)">
    <rect width="300" height="300" rx="50" fill="#211832"/>
    <g fill="#a9e2d0">
      <rect x="48" y="48" width="56" height="56" rx="10"/>
      <rect x="122" y="48" width="56" height="56" rx="10"/>
      <rect x="196" y="48" width="56" height="56" rx="10"/>
      <rect x="48" y="122" width="56" height="56" rx="10"/>
      <rect x="196" y="122" width="56" height="56" rx="10"/>
      <rect x="48" y="196" width="56" height="56" rx="10"/>
      <rect x="122" y="196" width="56" height="56" rx="10"/>
      <rect x="196" y="196" width="56" height="56" rx="10"/>
    </g>
    <rect x="122" y="122" width="56" height="56" rx="10" fill="#f4bd67"/>
  </g>
  <text x="490" y="245" fill="#a9e2d0" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" letter-spacing="3">CELLWISE</text>
  <text x="490" y="322" fill="#fff" font-family="Segoe UI, Arial, sans-serif" font-size="52" font-weight="700">A1 formulas for</text>
  <text x="490" y="384" fill="#fff" font-family="Segoe UI, Arial, sans-serif" font-size="52" font-weight="700">Word tables</text>
  <text x="490" y="450" fill="#e5deef" font-family="Segoe UI, Arial, sans-serif" font-size="25">No helper rows or columns. Local calculations.</text>
  <text x="490" y="530" fill="#f4bd67" font-family="Segoe UI, Arial, sans-serif" font-size="18">Not affiliated with or endorsed by Microsoft.</text>
</svg>
